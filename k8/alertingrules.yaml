apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: api-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: api.rules
      rules:
        - alert: APIPodCrashing
          expr: rate(kube_pod_container_status_restarts_total{namespace="default"}[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted more than once in the last 5 minutes."

        - alert: APIHighErrorRate
          expr: rate(api_requests_total{status=~"5.."}[5m]) > 0.1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High error rate on API"
            description: "API is returning 5xx errors at {{ $value }} requests/second."

        - alert: APIJobFailures
          expr: rate(api_job_errors_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "API SQS job failures detected"
            description: "API is failing to send jobs to SQS at {{ $value }} errors/second."

        - alert: APIPodNotRunning
          expr: kube_deployment_status_replicas_available{namespace="default"} < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Deployment {{ $labels.deployment }} has no available pods"
            description: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has zero available replicas."

        - alert: APIHighLatency
          expr: histogram_quantile(0.95, rate(api_request_duration_seconds_bucket[5m])) > 1
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "API P95 latency is high"
            description: "95th percentile API latency is {{ $value }}s, exceeding 1 second threshold."